name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  native:
    uses: ./.github/workflows/native.yml

  unix:
    name: Rust and native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libclang-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake boost
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets
      - run: cargo test -p kingfisher-vectorscan --doc
      - run: cargo run -p kingfisher-vectorscan --example scan
      - name: Native suite and generated bindings
        run: cargo test --workspace --all-targets --release --features kingfisher-vectorscan-sys/unit_hyperscan,kingfisher-vectorscan-sys/gen
      - name: Verify sys crate archive
        run: cargo package -p kingfisher-vectorscan-sys
      - name: Inspect high-level package (sys must be published before registry verification)
        run: cargo package -p kingfisher-vectorscan --list

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            target: x86_64-pc-windows-gnu
            cc: gcc
            cxx: g++
            processor: AMD64
          - os: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            target: aarch64-pc-windows-gnullvm
            cc: clang
            cxx: clang++
            processor: ARM64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-boost
            ${{ matrix.prefix }}-python
            git make
      - name: Build native library and test Rust bindings
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          NATIVE_PROCESSOR: ${{ matrix.processor }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cmake -S kingfisher-vectorscan-sys/vectorscan -B native-build \
            -G 'MinGW Makefiles' \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON \
            -DBUILD_UNIT=OFF -DBUILD_TOOLS=OFF -DFAT_RUNTIME=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_DOC=OFF \
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR="$NATIVE_PROCESSOR" \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX"
          cmake --build native-build --parallel 4
          cmake --install native-build
          export HYPERSCAN_ROOT
          HYPERSCAN_ROOT="$(cygpath -m "$MINGW_PREFIX")"
          cargo test --workspace --all-targets
          cargo run -p kingfisher-vectorscan --example scan
